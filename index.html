<style>body{font-family:system-ui;background:#f6f5f2;margin:0;padding:16px;color:#222}

@media(max-width:520px){.bar-row .lbl{width:96px}.kpi .box{min-width:78px}#cl{top:calc(env(safe-area-inset-top,0px) + 58px)}}</style></head><body>
<h1 class="sr">Oferty nieruchomości — działki i domy</h1>
<div class="bar">
 <nav class="tabs" id="tabs" aria-label="Kategorie">
  <button data-c="m_dz" class="on">🏠 Mieszk. — działki</button>
  <button data-c="m_dom">🏠 Mieszk. — domy</button>
  <button data-c="jez_dz">🌊 Jeziora — działki</button>
  <button data-c="jez_dom">🌊 Jeziora — domy</button>
 </nav>
 <span class="chip on" data-f="todo">Do przejrzenia</span>
 <span class="chip" data-f="short">⭐ Shortlist</span>
 <span class="chip" data-f="rej">Odrzucone</span>
 <span class="chip" data-f="all">Wszystkie</span>
 <button class="chip" id="statsToggle">📊 Statystyki</button>
 <span class="meta" id="meta"><span class="dot" id="dot"></span><span id="metaTxt">Łączę z bazą…</span></span>
</div>
<div id="counter" class="daycount" aria-live="polite"></div>
<div class="bar2">
 <select class="ctrl" id="sort" aria-label="Sortowanie">
  <option value="added_desc">Ostatnio dodane</option>
  <option value="listed_desc">Najnowsze ogłoszenia</option>
  <option value="price_asc">Cena ↑</option>
  <option value="price_desc">Cena ↓</option>
  <option value="pm2_asc">zł/m² ↑</option>
  <option value="area_desc">Powierzchnia ↓</option>
 </select>
 <input class="ctrl" id="pmin" type="number" inputmode="numeric" placeholder="cena od" aria-label="Cena od">
 <input class="ctrl" id="pmax" type="number" inputmode="numeric" placeholder="cena do" aria-label="Cena do">

</div>

<div id="stats"></div>
<div id="ov" role="dialog" aria-modal="true" aria-label="Szczegóły oferty"><div class="sh"><button id="cl" onclick="clO()" aria-label="Zamknij">✕</button><div class="gal" id="gg"></div><div class="st" id="ss"></div><div class="dt" id="dd"></div></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB_URL = "https://gbmvooprdfqufptfggdb.supabase.co";
const SB_KEY = "sb_publishable_-CNmiowgRI-WSnxnR42cOw_o0EFCRid";
const sb = supabase.createClient(SB_URL, SB_KEY);
// lista: tylko kolumny potrzebne do kart/filtrów/statystyk. notes/address/opis/params doładowywane przy otwarciu oferty.
const LIST_COLS = "id,cat,title,url,price,area,photos,loc,added,listed,portal,status,orig_price,lat,lon,phone";

let O = [];
let tab = localStorage.vTab || "m_dz", flt = "todo", sortBy="added_desc", cur=null, ci=0;
let q="", pmin=null, pmax=null, lastLoad=0, lastFocus=null, reviewQ=[], reviewI=-1;
let DECS=[], view="list", statCat="all", ZM={};
const median = arr => { if(!arr.length) return null; const s=[...arr].sort((a,b)=>a-b); const m=s.length>>1; return s.length%2?s[m]:(s[m-1]+s[m])/2; };
const CATPL = {m_dz:"Mieszk. działki",m_dom:"Mieszk. domy",jez_dz:"Jeziora działki",jez_dom:"Jeziora domy"};
const cap = s => s? s.charAt(0).toUpperCase()+s.slice(1) : s;
function computeZoneMedians(){ ZM={}; const g={}; O.forEach(o=>{ const p=pm2(o); if(p==null||!o.loc) return; (g[o.c]=g[o.c]||{}); (g[o.c][o.loc]=g[o.c][o.loc]||[]).push(p); }); for(const c in g){ ZM[c]={}; for(const l in g[c]) ZM[c][l]=median(g[c][l]); } }
const fmt = n => n==null?"":Number(n).toLocaleString("pl-PL");
// escapowanie do HTML (także cudzysłowy — bezpieczne też w atrybutach)
const esc = s => (s==null?"":String(s)).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// dekodowanie encji HTML ze scrapingu (m&sup2; -> m²) — bez tworzenia elementów (bezpieczne)
const ENT={amp:"&",lt:"<",gt:">",quot:'"',apos:"'",nbsp:" ",sup2:"²",sup3:"³",deg:"°",hellip:"…",ndash:"–",mdash:"—",eacute:"é",oacute:"ó",aacute:"á"};
const dec = s => s==null?"":String(s).replace(/&(#\d+|#x[0-9a-f]+|[a-z][a-z0-9]*);/gi,(m,e)=>{ if(e[0]==="#"){ const code=(e[1]==="x"||e[1]==="X")?parseInt(e.slice(2),16):parseInt(e.slice(1),10); return isNaN(code)?m:String.fromCodePoint(code);} const k=e.toLowerCase(); return ENT[k]!=null?ENT[k]:m; });
const txt = s => esc(dec(s));                                   // pole tekstowe ze scrapingu: dekoduj encje, potem escapuj
const safeUrl = u => /^https?:\/\//i.test(u||"") ? u : "";      // tylko http(s) w href
const SL = {short:"⭐ shortlist",rej:"✕ odrzucone"};
const statusLabel = s => SL[s] || "";
const mapsUrl = q2 => "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q2);
const norm = s => (s==="seen"?"rej":(s||"new"));
const decit = o => { const s=norm(o.st); return s==="short"?"short":s==="rej"?"rej":""; };
const pm2 = o => (o.pr&&o.a)? o.pr/o.a : null;
// różnica vs cena pierwotna (orig_price): up=wzrost, pct ujemny = spadek
const priceDelta = o => { if(o.op==null||o.pr==null||o.op<=0||o.op==o.pr) return null; const d=o.pr-o.op; return {pct:Math.round(d/o.op*100), amt:d, up:d>0, op:o.op}; };
const dropTag = d => { if(!d) return ""; const sg=d.up?"+":""; return `<span class="drop ${d.up?'up':'down'}">${d.up?'🔺':'🔻'} ${sg}${d.pct}% · ${sg}${fmt(d.amt)} zł</span>`; };

// słowniki parametrów (Otodom)
const PL_KEY={type:"Typ",fence:"Ogrodzenie",location:"Lokalizacja",vacant:"Wolne od zaraz",
 build_year:"Rok budowy",building_type:"Typ zabudowy",building_material:"Materiał",
 construction_status:"Stan",heating:"Ogrzewanie",market:"Rynek",rooms_num:"Pokoje",
 floors_num:"Kondygnacje",floor_no:"Piętro",media_types:"Media",utilities:"Media",
 access_types:"Dojazd",remote_services:"Obsługa zdalna",equipment_types:"Wyposażenie",
 security_types:"Ochrona",windows_type:"Okna",roof_type:"Dach",roofing:"Pokrycie dachu"};
const PL_VAL={recreational:"rekreacyjna",building:"budowlana",agricultural:"rolna",
 habitation:"siedliskowa",investment:"inwestycyjna",city:"miasto",country:"poza miastem",
 suburban:"podmiejska",primary:"pierwotny",secondary:"wtórny",detached:"wolnostojący",
 semi_detached:"bliźniak",terraced:"szeregowy",to_renovation:"do remontu",
 ready_to_use:"do zamieszkania",to_completion:"do wykończenia",tak:"tak",nie:"nie",
 brick:"cegła",cellular_concrete:"beton kom.",wood:"drewno"};
const valPL = v => { if(v==null)return""; const a=String(v).split(",").map(x=>PL_VAL[x.trim()]||x.trim().replace(/_/g," ")); return a.join(", "); };
const keyPL = k => PL_KEY[k]||k.replace(/_/g," ");

function setDot(state){ document.getElementById("dot").className="dot"+(state?" "+state:""); }

// licznik dziennego przeglądu (decyzje ⭐/✕ z DECS); "dziś" wg lokalnej daty → reset o północy
const dayKey = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
function updateCounter(){
 const el=document.getElementById("counter"); if(!el) return;
 const byDay={};
 DECS.forEach(r=>{ if(r.status!=="short"&&r.status!=="rej") return; const d=new Date(r.decided_at); if(isNaN(d)) return; const k=dayKey(d); (byDay[k]=byDay[k]||new Set()).add(r.offer_id); });
 const todayN=(byDay[dayKey(new Date())]||new Set()).size;
 let sum=0; for(let i=0;i<7;i++){ const dt=new Date(); dt.setHours(0,0,0,0); dt.setDate(dt.getDate()-i); sum+=(byDay[dayKey(dt)]||new Set()).size; }
 el.innerHTML=`📋 <span class="lbl">Dziś przejrzane:</span> <b>${todayN}</b> <span class="sep">·</span> <span class="lbl">śr. z 7 dni:</span> <b>${(sum/7).toFixed(1)}</b><span class="lbl">/dzień</span>`;
}
function scheduleMidnight(){ const n=new Date(); const next=new Date(n.getFullYear(),n.getMonth(),n.getDate()+1,0,0,5); setTimeout(()=>{ updateCounter(); scheduleMidnight(); }, next-n); }

function passFilters(o){
 const s=decit(o);
 if(flt==="todo"&&s) return false;
 if((flt==="short"||flt==="rej")&&s!==flt) return false;
 if(pmin!=null&&(o.pr==null||o.pr<pmin)) return false;
 if(pmax!=null&&(o.pr==null||o.pr>pmax)) return false;
 if(q){ const hay=((o.t||"")+" "+(o.loc||"")+" "+(o.adr||"")+" "+(o.n||"")).toLowerCase(); if(!hay.includes(q)) return false; }
 return true;
}
function sortRows(rows){
 const nn=(v)=>v==null?Infinity:v, nnd=(v)=>v==null?-Infinity:v;
 const f={
   price_asc:(a,b)=>nn(a.pr)-nn(b.pr), price_desc:(a,b)=>nnd(b.pr)-nnd(a.pr),
   pm2_asc:(a,b)=>nn(pm2(a))-nn(pm2(b)), area_desc:(a,b)=>nnd(b.a)-nnd(a.a),
   listed_desc:(a,b)=>String(b.li||"").localeCompare(String(a.li||"")),
   added_desc:(a,b)=>String(b.d||"").localeCompare(String(a.d||"")) }[sortBy];
 return rows.sort(f);
}

async function setSt(o, st){
 const target = (norm(o.st)===st) ? "new" : st;
 const prev=o.st; o.st=target; render(); if(cur&&cur.id===o.id) drawD();
 toast(target==="new"?"Cofnięto":statusLabel(target));
 const { error } = await sb.from("offers").update({status:target}).eq("id", o.id);
 if(error){ o.st=prev; render(); if(cur&&cur.id===o.id) drawD(); toast("Błąd zapisu — spróbuj ponownie"); return; }
 // dziennik aktywności — z obsługą błędu (cicha porażka psuła kalendarz)
 const { error:de } = await sb.from("decisions").insert({offer_id:o.id, status:target});
 if(de){ console.warn("decisions insert nieudany:", de.message); }
 else { DECS.push({offer_id:o.id, status:target, decided_at:new Date().toISOString()}); }
 if(view==="stats") renderStats();
 // auto-przeskok do następnej oferty po ocenie z poziomu modala (nie przy cofnięciu / nie z poziomu listy)
 if(cur && cur.id===o.id && (target==="short"||target==="rej")) nextOffer();
}
function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.style.display="block"; clearTimeout(t._x); t._x=setTimeout(()=>t.style.display="none",1600); }

function visibleRows(){ return sortRows(O.filter(o=>o.c===tab).filter(passFilters)); }
function render(){
 document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on", b.dataset.c===tab));
 document.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on", c.dataset.f===flt));
 const g=document.getElementById("grid"); g.innerHTML="";
 const inTab=O.filter(o=>o.c===tab);
 let rows=visibleRows();
 document.getElementById("metaTxt").textContent = rows.length+" / "+inTab.length+" ofert"+(setDot._s==="live"?" · na żywo":setDot._s==="off"?" · offline":"");
 updateCounter();
 if(!rows.length){ g.innerHTML='<div class="none">Pusto — zmień filtr, kategorię lub wyszukiwanie</div>'; return; }
 rows.forEach(o=>{
  const i=O.indexOf(o), s=decit(o);
  const d=document.createElement("div"); d.className="c"+(s?" st-"+s:"");
  const img=o.ph&&o.ph.length?`<img class="main" loading="lazy" decoding="async" alt="${esc(o.t||'oferta')}" src="${esc(o.ph[0])}">`:`<div class="noimg" aria-hidden="true">🏞️</div>`;
  const np=o.ph&&o.ph.length>1?`<span class="np">📷 ${o.ph.length}</span>`:"";
  const sb2=s?`<span class="stbadge">${statusLabel(s)}</span>`:"";
  const drop=dropTag(priceDelta(o));
  d.innerHTML=`<div class="top" onclick="openO(${i})">${img}<span class="s">${o.s??""}</span>${np}${sb2}
   <div class="b"><b>${o.pr?fmt(o.pr)+" zł":"cena?"}</b>${drop}<span class="a">${o.a?fmt(o.a)+" m²":""}${o.pr&&o.a?" · "+fmt(Math.round(o.pr/o.a))+" zł/m²":""}</span>
   <p>${txt(o.t)}</p><small>${txt(cap(o.loc))} · ${esc(o.po||"")} · ogł.: ${esc(o.li||"?")}</small></div></div>
   <div class="ft"><button onclick="setSt(O[${i}],'short')">⭐ Shortlist</button><button onclick="setSt(O[${i}],'rej')">✕ Odrzuć</button></div>`;
  g.appendChild(d);
 });
}

async function openOffer(o){
 cur=o; ci=0;
 document.getElementById("ov").classList.add("on"); drawS(); draw(); drawD();
 document.getElementById("cl").focus();
 if(cur.de===undefined){
   const { data } = await sb.from("offers").select("url,notes,address,description,params").eq("id",cur.id).single();
   if(data){ cur.de=data.description||""; cur.prm=data.params||{}; cur.n=data.notes||""; cur.adr=data.address||""; if(data.url)cur.u=data.url; }
   else if(cur===o){ cur.de=""; cur.prm={}; }
   if(cur===o) drawD();
 }
}
function openO(i){ lastFocus=document.activeElement; reviewQ=visibleRows(); reviewI=reviewQ.indexOf(O[i]); openOffer(O[i]); }
function nextOffer(){
 if(reviewI<0||!reviewQ.length){ clO(); return; }
 reviewI++;
 if(reviewI<reviewQ.length){ openOffer(reviewQ[reviewI]); toast("Następna oferta ("+(reviewI+1)+" / "+reviewQ.length+")"); }
 else { clO(); toast("To była ostatnia oferta z listy ✓"); }
}
function clO(){ document.getElementById("ov").classList.remove("on"); cur=null; render(); if(lastFocus&&lastFocus.focus){ lastFocus.focus(); lastFocus=null; } }
function draw(){ if(!cur)return; const g=document.getElementById("gg"); const ph=cur.ph||[];
 g.innerHTML=ph.length?`<img alt="${esc(cur.t||'zdjęcie oferty')}" src="${esc(ph[ci])}">`:'<span style="color:#fff;opacity:.7">Brak zdjęć — otwórz ogłoszenie</span>';
 if(ph.length>1) g.innerHTML+=`<button class="nv pv" onclick="nav(-1)" aria-label="Poprzednie zdjęcie">←</button><button class="nv nx" onclick="nav(1)" aria-label="Następne zdjęcie">→</button><span class="cnt">${ci+1} / ${ph.length}</span>`;
 [...document.getElementById("ss").children].forEach((im,j)=>im.classList.toggle("on", j===ci)); }
function drawS(){ const s=document.getElementById("ss"); s.innerHTML=""; (cur.ph||[]).forEach((u,j)=>{ const im=document.createElement("img"); im.loading="lazy"; im.alt="miniatura "+(j+1); im.src=u; im.onclick=()=>{ci=j;draw();}; s.appendChild(im); }); }
function paramsTable(p){
 if(!p||!Object.keys(p).length) return "";
 const rows=Object.entries(p).map(([k,v])=>`<tr><td>${txt(keyPL(k))}</td><td>${txt(valPL(v))}</td></tr>`).join("");
 return `<table class="params">${rows}</table>`;
}
function drawD(){ const d=document.getElementById("dd"); const s=decit(cur); const pdl=priceDelta(cur);
 const q2=(cur.lat!=null&&cur.lon!=null)?(cur.lat+","+cur.lon):(cur.adr||"");
 const loc=q2?`<div class="loc">📍 <a href="${esc(mapsUrl(q2))}" target="_blank" rel="noopener">${txt(cur.adr||"Otwórz w Mapach Google")} ↗</a></div>`:"";
 const tel=cur.tel?`<div><a class="call" href="tel:${esc(cur.tel)}">📞 Zadzwoń ${esc(cur.tel)}</a></div>`:"";
 const priceLine=`<b style="font-size:17px">${cur.pr?fmt(cur.pr)+" zł":"cena?"}</b>${pdl?` ${dropTag(pdl)} <span style="color:#777;font-size:12px">(pierwotnie ${fmt(pdl.op)} zł)</span>`:""}`;
 let zctx="";
 const zm=(ZM[cur.c]||{})[cur.loc], mine=pm2(cur);
 if(zm&&mine){ const diff=Math.round((mine/zm-1)*100); const cls=diff>0?'up':(diff<0?'down':''); zctx=`<div class="loc">📊 ${fmt(Math.round(mine))} zł/m² vs mediana strefy <b>${fmt(Math.round(zm))} zł/m²</b>${cls?` <span class="drop ${cls}">${diff>0?'+':''}${diff}%</span> ${diff>0?'drożej':diff<0?'taniej':'='} niż w okolicy`:''}</div>`; }
 const descBlock = cur.de===undefined ? `<div class="desc" style="color:#999">wczytuję opis…</div>` : (cur.de?`<div class="desc">${txt(cur.de)}</div>`:"");
 d.innerHTML=`<h3>${txt(cur.t)}</h3>${priceLine} <span style="color:#777">${cur.a?fmt(cur.a)+" m²":""}${cur.pr&&cur.a?" · "+fmt(Math.round(cur.pr/cur.a))+" zł/m²":""} · ${txt(cap(cur.loc))} · ${esc(cur.po||"")} · ogł.: ${esc(cur.li||"?")}${s?" · <b>"+statusLabel(s)+"</b>":""}</span>
 ${loc}${zctx}${tel}${paramsTable(cur.prm)}<div class="nn">${txt(cur.n||"")}</div>${descBlock}
 <div class="acts"><button onclick="setSt(cur,'short')">⭐ Shortlist</button><button onclick="setSt(cur,'rej')">✕ Odrzuć</button><a class="go" href="${esc(safeUrl(cur.u))}" target="_blank" rel="noopener">Otwórz ogłoszenie ↗</a></div>`; }
function nav(k){ const n=(cur.ph||[]).length; if(!n)return; ci=(ci+k+n)%n; draw(); }

document.getElementById("tabs").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b)return; tab=b.dataset.c; localStorage.vTab=tab; render(); });
document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{ flt=c.dataset.f; render(); });
document.getElementById("sort").value=sortBy;
document.getElementById("sort").onchange=e=>{ sortBy=e.target.value; render(); };
const deb=(fn,ms)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms);};};
document.getElementById("q").addEventListener("input",deb(e=>{ q=e.target.value.trim().toLowerCase(); render(); },200));
document.getElementById("pmin").addEventListener("input",deb(e=>{ pmin=e.target.value!==""?+e.target.value:null; render(); },300));
document.getElementById("pmax").addEventListener("input",deb(e=>{ pmax=e.target.value!==""?+e.target.value:null; render(); },300));
document.addEventListener("keydown",e=>{ if(!cur)return;
 if(e.key==="Escape"){ clO(); return; }
 if(e.key==="ArrowLeft"){ nav(-1); return; }
 if(e.key==="ArrowRight"){ nav(1); return; }
 if(e.key==="Tab"){ const f=[...document.querySelectorAll("#ov button, #ov a[href]")].filter(el=>el.offsetParent!==null); if(!f.length)return; let i=f.indexOf(document.activeElement);
   if(e.shiftKey){ if(i<=0){ f[f.length-1].focus(); e.preventDefault(); } } else { if(i===f.length-1){ f[0].focus(); e.preventDefault(); } } }
});
document.getElementById("ov").addEventListener("click",e=>{ if(e.target.id==="ov")clO(); });

// ---------- STATYSTYKI (uproszczone, mobile-first: tylko panele wpływające na decyzję) ----------
function setView(v){ view=v;
 document.getElementById("grid").style.display=v==="list"?"":"none";
 document.querySelector(".bar2").style.display=v==="list"?"":"none";
 document.getElementById("counter").style.display=v==="list"?"":"none";
 document.getElementById("stats").style.display=v==="stats"?"block":"none";
 const b=document.getElementById("statsToggle"); b.classList.toggle("on",v==="stats"); b.textContent=v==="stats"?"← Oferty":"📊 Statystyki";
 if(v==="stats") renderStats();
}
const daysBetween = (a,b)=> Math.round((b-a)/864e5);
const statSet = () => statCat==="all"?O:O.filter(o=>o.c===statCat);
const panel = (title,sub,html)=>`<div class="panel"><h3>${title}</h3>${sub?`<div class="sub">${sub}</div>`:""}${html}</div>`;
const bar = (label,val,max,valTxt)=>{ const w=max?Math.round(val/max*100):0; return `<div class="bar-row"><span class="lbl">${esc(label)}</span><span class="bar-track"><span class="bar-fill" style="width:${w}%"></span></span><span class="val">${valTxt??val}</span></div>`; };

function panelLejek(rows){
 const c={new:0,short:0,rej:0}; rows.forEach(o=>{ const k=norm(o.st); c[k]=(c[k]||0)+1; });
 const decided=c.short+c.rej, rejPct=decided?Math.round(c.rej/decided*100):0;
 return panel("Przegląd","Ile ofert do zrobienia i jak rozkładają się decyzje.",
  `<div class="kpi"><div class="box"><b>${c.new}</b><span>do przejrzenia</span></div><div class="box"><b class="grow">${c.short}</b><span>⭐ shortlist</span></div><div class="box"><b class="gred">${c.rej}</b><span>✕ odrzucone</span></div><div class="box"><b>${rejPct}%</b><span>odrzuceń z ocenionych</span></div></div>`);
}
function panelBenchmark(rows){
 const g={}; rows.forEach(o=>{ const p=pm2(o); if(p==null||!o.loc)return; (g[o.loc]=g[o.loc]||[]).push(o); });
 const arr=Object.entries(g).map(([loc,os])=>{ const ps=os.map(pm2).filter(x=>x!=null);
   return {loc,n:os.length,mp:median(ps),mn:Math.min(...ps),mx:Math.max(...ps)}; }).filter(x=>x.mp!=null).sort((a,b)=>b.n-a.n);
 if(!arr.length) return panel("Tanio czy drogo? (zł/m² wg strefy)","Brak ofert z ceną i metrażem w tej kategorii.","");
 const body=arr.map(r=>`<tr><td>${txt(cap(r.loc))}</td><td class="num">${r.n}</td><td class="num"><b>${fmt(Math.round(r.mp))}</b></td><td class="num">${fmt(Math.round(r.mn))}–${fmt(Math.round(r.mx))}</td></tr>`).join("");
 return panel("Tanio czy drogo? (zł/m² wg strefy)","Mediana zł/m² i widełki w każdej strefie — szybka ocena, czy oferta jest poniżej/powyżej rynku.",
  `<div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Strefa</th><th class="num">Ofert</th><th class="num">Med. zł/m²</th><th class="num">Widełki</th></tr></thead><tbody>${body}</tbody></table></div>`);
}
function panelOkazje(rows){
 const drops=rows.map(o=>({o,d:priceDelta(o)})).filter(x=>x.d&&!x.d.up).sort((a,b)=>a.d.pct-b.d.pct).slice(0,6);
 const today=new Date();
 const hang=rows.filter(o=>norm(o.st)==="new"&&o.li&&/^\d{4}-\d{2}-\d{2}/.test(o.li)).map(o=>({o,days:daysBetween(new Date(o.li),today)})).filter(x=>x.days>=0).sort((a,b)=>b.days-a.days).slice(0,6);
 const dHtml=drops.length?`<table class="tbl"><thead><tr><th>Oferta</th><th class="num">Teraz</th><th class="num">Spadek</th></tr></thead><tbody>`+drops.map(x=>`<tr><td>${txt((x.o.t||"").slice(0,34))}</td><td class="num">${fmt(x.o.pr)} zł</td><td class="num gred">${x.d.pct}%</td></tr>`).join("")+`</tbody></table>`:`<div class="sub">Brak spadków (pojawią się, gdy ceny ofert spadną).</div>`;
 const hHtml=hang.length?`<table class="tbl"><thead><tr><th>Oferta</th><th class="num">Cena</th><th class="num">Wisi</th></tr></thead><tbody>`+hang.map(x=>`<tr><td>${txt((x.o.t||"").slice(0,34))}</td><td class="num">${x.o.pr?fmt(x.o.pr)+" zł":"—"}</td><td class="num">${x.days} dni</td></tr>`).join("")+`</tbody></table>`:`<div class="sub">Brak dat ogłoszeń.</div>`;
 return panel("Okazje negocjacyjne","Największe spadki cen i oferty wiszące najdłużej (potencjał negocjacji).",
  `<b style="font-size:13px">🔻 Największe spadki</b>${dHtml}<div style="height:12px"></div><b style="font-size:13px">⏳ Najdłużej wiszące</b>${hHtml}`);
}
function panelPodaz(rows){
 const bz={},bp={}; rows.forEach(o=>{ if(o.loc)bz[o.loc]=(bz[o.loc]||0)+1; if(o.po)bp[o.po]=(bp[o.po]||0)+1; });
 const za=Object.entries(bz).sort((a,b)=>b[1]-a[1]).slice(0,8), zmax=Math.max(1,...za.map(x=>x[1]));
 const pa=Object.entries(bp).sort((a,b)=>b[1]-a[1]), pmax=Math.max(1,...pa.map(x=>x[1]));
 const priced=rows.map(o=>o.pr).filter(x=>x);
 const bk=[[0,250000,"<250k"],[250000,500000,"250–500k"],[500000,750000,"500–750k"],[750000,1000000,"750k–1M"],[1000000,1e12,">1M"]];
 const hp=bk.map(([a,b,l])=>[l,priced.filter(p=>p>=a&&p<b).length]), hpmax=Math.max(1,...hp.map(x=>x[1]));
 return panel("Gdzie jest podaż","Ile ofert w strefie, na portalu i w przedziale ceny.",
  `<b style="font-size:13px">Wg strefy (top 8)</b>${za.map(([l,n])=>bar(cap(l),n,zmax,n)).join("")}<div style="height:10px"></div><b style="font-size:13px">Wg portalu</b>${pa.map(([l,n])=>bar(l,n,pmax,n)).join("")}<div style="height:10px"></div><b style="font-size:13px">Przedział ceny</b>${hp.map(([l,n])=>bar(l,n,hpmax,n)).join("")}`);
}
function panelShortlist(){
 const sl=O.filter(o=>norm(o.st)==="short");
 if(!sl.length) return panel("⭐ Shortlist","Tu pojawią się oferty oznaczone ⭐ — zestawione do finalnej decyzji.","");
 const body=sl.map(o=>{ const links=[]; if(o.tel)links.push(`<a href="tel:${esc(o.tel)}">📞 ${esc(o.tel)}</a>`); if(o.lat!=null&&o.lon!=null)links.push(`<a href="${esc(mapsUrl(o.lat+','+o.lon))}" target="_blank" rel="noopener">📍 Mapa</a>`);
   return `<div class="slcard"><div class="t">${txt(o.t)}</div><div class="m">${o.pr?fmt(o.pr)+" zł":"—"}${o.a?" · "+fmt(o.a)+" m²":""}${o.pr&&o.a?" · "+fmt(Math.round(o.pr/o.a))+" zł/m²":""} · ${txt(cap(o.loc))} · ${esc(CATPL[o.c]||"")}</div>${links.length?`<div class="lnk">${links.join("")}</div>`:""}</div>`; }).join("");
 return panel("⭐ Shortlist ("+sl.length+")","Twoi faworyci do finalnej decyzji.",body);
}
function renderStats(){
 const rows=statSet();
 const tabs=`<div class="stat-tabs">`+[["all","Wszystkie"],["m_dz","🏠 Działki"],["m_dom","🏠 Domy"],["jez_dz","🌊 Jez. działki"],["jez_dom","🌊 Jez. domy"]].map(([v,l])=>`<button class="${statCat===v?"on":""}" onclick="statCat='${v}';renderStats()">${l}</button>`).join("")+`</div>`;
 document.getElementById("stats").innerHTML = tabs + panelLejek(rows) + panelBenchmark(rows) + panelOkazje(rows) + panelShortlist() + panelPodaz(rows);
}
document.getElementById("statsToggle").onclick=()=>setView(view==="stats"?"list":"stats");

const mapRow = r => ({id:r.id,c:r.cat,t:r.title,u:r.url,pr:r.price,a:r.area,ph:r.photos||[],n:r.notes||"",loc:r.loc||"",d:r.added,po:r.portal,st:r.status||"new",li:(r.listed||""),adr:r.address||"",lat:r.lat,lon:r.lon,tel:r.phone||"",op:r.orig_price});

async function load(){
 const { data, error } = await sb.from("offers").select(LIST_COLS);
 if(error){ if(!O.length) document.getElementById("grid").innerHTML='<div class="none">Błąd wczytywania bazy: '+esc(error.message)+'</div>'; setDot("off"); setDot._s="off"; return; }
 const byId={}; O.forEach(o=>byId[o.id]=o);
 O = data.map(r=>{ const m=mapRow(r); const old=byId[r.id]; if(old){ m.de=old.de; m.prm=old.prm; if(old.n)m.n=old.n; if(old.adr)m.adr=old.adr; } return m; });
 computeZoneMedians();
 if(cur){ const c=O.find(x=>x.id===cur.id); if(c){ cur=c; drawD(); } }   // re-link otwartej oferty po przeładowaniu
 const dr = await sb.from("decisions").select("offer_id,status,decided_at"); DECS = dr.data||[];
 lastLoad=Date.now();
 document.title="Oferty ("+O.length+")"; render(); if(view==="stats") renderStats();
}
function subscribe(){
 sb.channel("offers-rt").on("postgres_changes",{event:"*",schema:"public",table:"offers"}, payload=>{
   const r=payload.new||payload.old; if(!r) return;
   if(payload.eventType==="DELETE"){ O=O.filter(o=>o.id!==r.id); }
   else { const o=O.find(x=>x.id===r.id); const m=mapRow(payload.new); if(o){ Object.assign(o,m); } else { O.push(m); } }
   render(); if(cur){ const c=O.find(x=>x.id===cur.id); if(c){ const de=cur.de,prm=cur.prm; cur=c; cur.de=de; cur.prm=prm; drawD(); } }
 }).subscribe(s=>{ setDot._s=(s==="SUBSCRIBED"?"live":"off"); setDot(setDot._s); render(); });
}
// odśwież po powrocie do karty, ale nie częściej niż co 60 s (realtime i tak trzyma dane świeże)
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible" && Date.now()-lastLoad>60000) load(); });
load().then(subscribe);
scheduleMidnight();
if("serviceWorker" in navigator){ window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{})); }
</script></body></html>
