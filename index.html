<!-- IKONY iOS (2026-08-07). apple-touch-icon MUSI być BEZ kanału alfa: iOS nie

     nakłada własną maskę squircle. icon-192.png ma przezroczyste rogi zaokrąglonego
     kwadratu (4% pikseli), więc na telefonie dawał czarne narożniki. Nowe pliki są
     pełnoklatkowe (tło #2e7d46 wypełnia rogi) i płaskie — zaokrągla samo iOS.

/* POPRAWKA 21.08 — plakietki kotwiczą się do ZDJĘCIA, nie do całej karty.
   Co było źle: .s, .np, .stbadge i .nflag mają position:absolute, a jedynym
   position:relative w karcie było .c — czyli KARTA. Te kotwiczone od góry
   (.s, .np) trafiały na zdjęcie przez przypadek, ale .stbadge z bottom:8px
   siadała na stopce i ZAKRYWAŁA przycisk 🚫 (Mateusz przysłał zrzut 21.08).
   Ten sam błąd co z przyciskiem ✕ w modalu: element pozycjonowany bezwzględnie
   trafia tam, gdzie stoi najbliższy przodek z position, a nie tam, gdzie go
   widzimy w kodzie. Plakietki należą do zdjęcia, więc dostaje ono swój kontener. */
.med{position:relative}
.c:hover{box-shadow:0 4px 14px rgba(0,0,0,.1)}.c img.main,.noimg{width:100%;aspect-ratio:4/3;object-fit:cover;background:#eceae4;display:flex;align-items:center;justify-content:center;font-size:40px}

.b{padding:10px 12px}.b b{font-size:16px}.a{color:#777;font-size:12px;margin-left:6px}.b p{margin:4px 0;font-size:13px;line-height:1.3}small{color:#6f6d67}

/* min-width 76px (2026-08-25): po dołożeniu 🔝 Top rząd ma cztery przyciski. Bez

   nie przyjęty na oko: na iPhonie (karta 343 px) rząd ma 321 px użytecznej szerokości,
   czyli 75,75 px na przycisk przy trzech odstępach po 6 px — pierwsza wersja z 76 px
   przekraczała to o ćwierć piksela i wypychała 🚫 do osobnego rzędu na całą szerokość.
   Przy 72 px telefon mieści czwórkę w JEDNYM rzędzie, a węższe ekrany i kolumnowy
   desktop zawijają się czysto 2+2. Telefon jest głównym urządzeniem Mateusza, więc to
   jego układ wyznacza próg. */
/* 🚫 jest ikoną bez etykiety, więc nie ma powodu, żeby rósł jak pozostałe. Bez tego

/* ── PORÓWNANIE TOP v17 (2026-08-27) ──────────────────────────────────────
   Elastyczny workspace decyzyjny: przyklejone nagłówki, lokalne ustawienia
   widoku, automatyczne podsumowania i autosave bez zmiany schematu bazy. */
.g.compare{display:block;max-width:none}
.topcmp-shell{--criterion-w:154px;--offer-w:270px;--cell-pad:6px;--head-img:90px;position:relative}
.topcmp-shell[data-density="comfortable"]{--cell-pad:10px;--head-img:118px}
.topcmp-shell[data-width="narrow"]{--offer-w:225px}.topcmp-shell[data-width="wide"]{--offer-w:330px}
.topcmp-shell[data-density="mobile"]{--criterion-w:72px;--offer-w:120px;--cell-pad:2px;--head-img:0px}
.topcmp-shell.focus{position:fixed;inset:0;z-index:3500;background:#f6f5f2;padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));display:flex;flex-direction:column}
.topcmp-shell.focus .topcmp-scroll{flex:1;max-height:none}.topcmp-shell.focus .topcmp-intro{display:none}
.topcmp-intro{margin:0 0 8px;color:#5f5d57;font-size:12.5px;line-height:1.45}
.topcmp-toolbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:8px;padding:7px;background:#ebe8e1;border:1px solid #ddd9d0;border-radius:11px}
.topcmp-toolbar label{display:flex;align-items:center;gap:5px;font-size:11px;color:#5e5b55;font-weight:650;white-space:nowrap}
.topcmp-toolbar select,.topcmp-toolbar button{border:1px solid #d0ccc2;background:#fff;color:#302e2a;border-radius:8px;min-height:34px;padding:6px 9px;font:inherit;font-size:12px;cursor:pointer}
.topcmp-toolbar select:focus,.topcmp-toolbar button:focus-visible{outline:0;border-color:#2e7d46;box-shadow:0 0 0 2px rgba(46,125,70,.15)}
.topcmp-toolbar button{font-weight:700}.topcmp-toolbar .push{margin-left:auto}.topcmp-toolbar .restore{color:#27693c}.topcmp-toolbar .restore[disabled]{opacity:.45;cursor:default}
.topcmp-scroll{width:100%;max-height:calc(100dvh - 250px);overflow:auto;overscroll-behavior:contain;border:1px solid #d7d3ca;border-radius:12px;background:#fff;box-shadow:0 3px 15px rgba(0,0,0,.06);scrollbar-gutter:stable}
.topcmp{border-collapse:separate;border-spacing:0;min-width:max-content;width:100%;font-size:13px}
.topcmp-shell[data-fit="true"] .topcmp{min-width:100%;width:100%;table-layout:fixed}
.topcmp th,.topcmp td{border-right:1px solid #e7e3da;border-bottom:1px solid #e7e3da;padding:var(--cell-pad);vertical-align:top;background:#fff}
.topcmp tr:last-child th,.topcmp tr:last-child td{border-bottom:0}.topcmp th:last-child,.topcmp td:last-child{border-right:0}
.topcmp .criterion{position:sticky;left:0;z-index:4;width:var(--criterion-w);min-width:var(--criterion-w);max-width:var(--criterion-w);background:#f2efe8;color:#45423c;font-weight:750;line-height:1.25;box-shadow:1px 0 0 #ddd9d0}
.topcmp thead th{position:sticky;top:0;z-index:5;box-shadow:0 1px 0 #d8d4ca,0 5px 12px rgba(0,0,0,.05)}
.topcmp thead .criterion{z-index:7;background:#e7e2d7;vertical-align:middle}
.topcmp .offer-col,.topcmp .offer-cell{width:var(--col-w,var(--offer-w));min-width:var(--col-w,var(--offer-w));max-width:var(--col-w,var(--offer-w))}
.topcmp .offer-col{padding:0;background:#fff}
.topcmp-col-resizer{position:absolute;right:-5px;top:0;bottom:0;width:10px;z-index:12;cursor:col-resize;touch-action:none}
.topcmp-col-resizer::after{content:"";position:absolute;right:4px;top:0;bottom:0;width:1px;background:transparent;transition:background .12s}
.topcmp-col-resizer:hover::after,.topcmp-col-resizer:focus-visible::after{background:#2e7d46}
.topcmp-row-resizer{position:absolute;left:0;right:0;bottom:-5px;height:10px;z-index:11;cursor:row-resize;touch-action:none}
.topcmp-row-resizer::after{content:"";position:absolute;left:0;right:0;bottom:4px;height:1px;background:transparent;transition:background .12s}
.topcmp-row-resizer:hover::after,.topcmp-row-resizer:focus-visible::after{background:#2e7d46}
body.top-resizing{cursor:col-resize;user-select:none}body.top-resizing.row{cursor:row-resize}

/* ── MAPA (v8, 2026-08-06) ───────────────────────────────────────────────── */
/* Widoczność sterowana KLASĄ, nie stylem inline. Powód (2026-08-07): setView()
   ustawiał element.style.display="block", a styl inline bije regułę z arkusza —
   więc `#mapWrap.fs{display:flex}` nigdy nie wchodziło i mapa na pełnym ekranie
   dostawała wysokość 0 px (kontener był blokiem, a #map miał flex:1 bez flexa). */
#mapWrap{display:none;padding:8px 10px 20px}
#mapWrap.on{display:block}
#mapWrap.on.fs{display:flex}
.mapbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.mchips{display:flex;gap:4px;flex-wrap:wrap}
.mchip{font-size:12px;padding:5px 9px;border-radius:14px;border:1px solid #d5d5d8;background:#fff;cursor:pointer;user-select:none;white-space:nowrap}
.mchip.on{background:#1a1a1c;color:#fff;border-color:#1a1a1c}
.mtog{font-size:12px;color:#555;display:flex;align-items:center;gap:4px;cursor:pointer}
/* Wysokosc z dvh: na telefonie pasek URL Safari zmienia viewport i przy 100vh mapa
   wystawala pod krawedz ekranu, zabierajac przyciski oceny. */
#map{height:62dvh;min-height:340px;border-radius:12px;border:1px solid #e3e3e6;background:#eef1f4;z-index:0}
/* ── PEŁNY EKRAN MAPY (2026-08-07) ────────────────────────────────────────────
   NA CSS, NIE PRZEZ Fullscreen API. Powód jest twardy: WebKit na iPhonie nie
   udostępnia Element.requestFullscreen() — działa on wyłącznie dla <video>. Czyli
   na GŁÓWNYM urządzeniu Mateusza natywny fullscreen po prostu by nie zadziałał,
   a musielibyśmy i tak mieć ścieżkę zapasową. Jedna droga, która działa wszędzie,
   jest lepsza niż dwie, z których jedna milczy akurat na telefonie.
   W trybie standalone (ikona z ekranu głównego) nie ma paska przeglądarki, więc
   position:fixed to jest już prawdziwy pełny ekran. */
#mapWrap.fs{position:fixed;inset:0;z-index:9000;background:#f6f5f2;padding:0;margin:0;
  flex-direction:column;overflow:hidden}
/* Pasek filtrów zjeżdża pod notch/Dynamic Island. env(safe-area-inset-*) dziala,
   bo <meta viewport> ma viewport-fit=cover. */
#mapWrap.fs .mapbar{margin:0;padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 8px;
  background:#f6f5f2;border-bottom:1px solid #e6e4df;flex:0 0 auto}
/* 100% zamiast 100dvh: kontener jest flexem, wiec mapa bierze CALA reszte wysokosci
   po pasku filtrow i stopce — bez zgadywania, ile te paski zajmuja. */
#mapWrap.fs #map{height:auto;flex:1 1 auto;min-height:0;border-radius:0;border:0}
#mapWrap.fs .mapfoot{flex:0 0 auto;margin:0;padding:7px 10px calc(env(safe-area-inset-bottom,0px) + 7px);
  background:#f6f5f2;border-top:1px solid #e6e4df;font-size:12px}
#mapWrap.fs #mapMissing{display:none}   /* lista braków nie ma sensu na pełnym ekranie */
body.fs-lock{overflow:hidden}           /* tło nie przewija się pod mapą */
.fsbtn{font-size:12px;padding:5px 9px;border-radius:14px;border:1px solid #d5d5d8;
  background:#fff;cursor:pointer;white-space:nowrap;margin-left:auto}
#mapWrap.fs .fsbtn{background:#1a1a1c;color:#fff;border-color:#1a1a1c}
/* Zamykanie: ✕ jako zwykły element PASKA, nie pływający absolutnie. Pierwsza wersja
   wisiała na position:absolute z odsunięciem 56 px od góry i nachodziła na przycisk
   „Zwykły widok". Jako element flexa z margin-left:auto zawijał się z kolei do
   OSOBNEGO, trzeciego wiersza i zjadał 55 px wysokości mapy. Wersja trzecia i dobra:
   absolutnie, ale względem PASKA (position:relative), nie względem całego kontenera —
   wtedy jedyna stała liczba to własny padding paska, który znam. Miejsce rezerwuje
   padding-right, więc chipy nigdy pod niego nie wejdą, niezależnie od zawijania.
   44×44 px to minimum dotykowe z wytycznych Apple. */
#mapClose{display:none}
#mapWrap.fs .mapbar{position:relative;padding-right:62px}   /* miejsce na ✕ */
#mapWrap.fs #mapClose{display:flex;position:absolute;right:10px;
  top:calc(env(safe-area-inset-top,0px) + 6px);
  width:44px;height:44px;align-items:center;justify-content:center;
  border-radius:50%;border:0;background:#1a1a1c;color:#fff;font-size:19px;
  cursor:pointer}
/* Na pełnym ekranie ✕ JEST wyjściem — tekstowy przełącznik byłby drugim przyciskiem
   robiącym to samo, a miejsca w pasku na telefonie nie ma. */
#mapWrap.fs .fsbtn{display:none}
/* Legenda kolorów zjadała 125 px z 812 (15% ekranu). Na pełnym ekranie liczy się
   mapa — zostaje sam licznik „na mapie X z Y", bo on mówi, czy mapa nie kłamie. */
#mapWrap.fs .mapfoot .leg{display:none}
.mapfoot{font-size:12px;color:#666;margin-top:7px;line-height:1.5}
.mapfoot b{color:#1a1a1c}
.mapfoot .lnk{color:#0a58ca;text-decoration:underline;cursor:pointer}
#mapMissing{margin-top:8px}
#mapMissing table{width:100%;border-collapse:collapse;font-size:12px}
#mapMissing td{padding:5px 6px;border-bottom:1px solid #eee;vertical-align:top}
#mapMissing td:first-child{white-space:nowrap;color:#777}
#mapMissing .mm-open{color:#0a58ca;cursor:pointer;text-decoration:underline}
/* ── PINEZKI (przebudowa 2026-08-07) ──────────────────────────────────────────
   KODOWANIE ODWZOROWUJE STRUKTURE DANYCH, a nie listę czterech kategorii:
     KOLOR   = region  (niebieski = Łódź/okolice, pomarańczowy = jeziora)
     KSZTAŁT = rodzaj  (kwadrat = działka, koło = dom)
     OBWÓDKA = status  (złota gruba = shortlist, +czarny pierścień = Top,
                      przygaszona = odrzucone)
   Kategorie są przecież 2×2 (miasto/jezioro × działka/dom), więc dwa niezależne
   kanały opisują je bez reszty — i to jest cała różnica jakościowa wobec wersji
   z 06.08, gdzie o wszystkim decydował sam kolor.

   DLACZEGO NIE CZTERY KOLORY. Sprawdzone walidatorem palet (nie na oko): stara
   czwórka #2b7bba/#1f9d55/#7b4bc9/#d1671f przy sprawdzeniu WSZYSTKICH par oblewała
   nawet próg dla NORMALNEGO widzenia — niebieski↔fiolet ΔE 14,8 (próg 15), a przy
   deuteranopii 6,3. Na mapie każde dwie kategorie mogą leżeć obok siebie, więc liczy
   się każda para, nie tylko sąsiednie w legendzie. Do tego zieleń #1f9d55 siedziała
   na zielonych polach i lasach OSM, czyli w najgorszym możliwym tle.
   Para #1976d2 / #e8590c to kanoniczna para bezpieczna dla daltonizmu: ΔE 26,2
   przy protanopii i 35,1 przy normalnym widzeniu, na jasnym i ciemnym tle.
   Rodzaj nieruchomości niesie KSZTAŁT, więc identyczność nigdy nie zależy od
   samego koloru — a jeziora i Łódź leżą 100 km od siebie i tak nigdy nie sąsiadują.

   ROZMIARY. Poprzednio 14 px (nieocenione) i 11 px (odrzucone) — za mało, żeby
   trafić palcem i żeby odróżnić kształt. Teraz 26/34/18 px. */
.pin{box-sizing:border-box;box-shadow:0 1px 4px rgba(0,0,0,.5);
  border:2px solid #fff;background-clip:padding-box}
.pin.k-dz{border-radius:3px}      /* działka — kwadrat (parcela) */
.pin.k-dom{border-radius:50%}     /* dom — koło */
.pin.st-new{width:26px;height:26px}
.pin.st-short{width:34px;height:34px;border:3px solid #f5a300;
  box-shadow:0 0 0 2px rgba(245,163,0,.35),0 2px 6px rgba(0,0,0,.5)}
/* Top = pinezka shortlisty plus czarny pierścień. Celowo TA SAMA złota obwódka:
   Top nie jest osobnym bytem, tylko awansem w tym samym lejku, więc ma wyglądać
   jak shortlist o szczebel wyżej. Czerń odróżnia go od obu kolorów regionu
   (#1976d2 / #e8590c) i od samego złota, na jasnym i ciemnym tle mapy. */
.pin.st-visited{width:40px;height:40px;border:3px solid #f5a300;
  box-shadow:0 0 0 3px #1f1e1b,0 2px 8px rgba(0,0,0,.55)}
.pin.st-rej{width:18px;height:18px;opacity:.5}
/* Etykieta ceny na pinezce — pokazywana WYŁĄCZNIE przy dużym zoomie (klasa .zoom-lg
   na kontenerze mapy). Przy oddaleniu 400 etykiet byłoby nieczytelną kaszą, a przy
   zbliżeniu to najszybszy sposób porównania ofert w okolicy bez klikania każdej.
   Przełączamy JEDNĄ KLASĄ na kontenerze, nie przebudową 400 ikon — przebudowa przy
   każdym zoomie zauważalnie zamula telefon. */
.pinlab{display:none;position:absolute;left:50%;transform:translateX(-50%);
  top:100%;margin-top:2px;white-space:nowrap;font-size:11px;font-weight:700;
  line-height:1.35;padding:1px 5px;border-radius:6px;background:rgba(255,255,255,.94);
  color:#1a1a1c;box-shadow:0 1px 3px rgba(0,0,0,.3);pointer-events:none}
#map.zoom-lg .pinlab{display:block}
#map.zoom-lg .st-rej .pinlab{display:none}   /* odrzucone bez etykiet — to tylko tło */
/* Klaster: NEUTRALNA grafit, nie kolor kategorii. Domyślne zielono-żółto-pomarańczowe
   bąbelki markerclustera czytały się jak jeszcze jedna kategoria. */
.mclus{background:rgba(38,38,42,.88);color:#fff;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-weight:700;
  border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.45)}
/* Moja lokalizacja — celowo INNY język wizualny niż oferty (nie kwadrat, nie koło
   z obwódką): pulsujący punkt z aureolą dokładności, jak w mapach systemowych. */
.mepin{width:16px;height:16px;border-radius:50%;background:#1a73e8;
  border:3px solid #fff;box-shadow:0 0 0 2px rgba(26,115,232,.35),0 1px 4px rgba(0,0,0,.4)}
/* Przycisk lokalizacji jest KONTROLKĄ LEAFLETA, nie elementem wstawionym do #map:
   drawMap() czyści innerHTML kontenera przed inicjalizacją mapy, więc zwykły <button>
   w markupie znikał bez śladu. Leaflet sam trzyma kontrolki we własnej warstwie
   i pozycjonuje je przy narożniku — także po wejściu na pełny ekran. */
.mebtn{width:40px;height:40px;border-radius:50%;border:0;background:#fff;color:#1a1a1c;
  font-size:18px;cursor:pointer;box-shadow:0 1px 5px rgba(0,0,0,.35);
  display:flex;align-items:center;justify-content:center;margin:0 12px 12px 0}

.pp .pa .hid{border-color:#e0b4b4}
.leg{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:#666;margin-top:6px;align-items:center}

const dayKey = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
function updateCounter(){

 // akurat o najważniejszych ruchach dnia.

}

function passFilters(o){

function sortRows(rows){

   price_asc:(a,b)=>nn(a.pr)-nn(b.pr), price_desc:(a,b)=>nnd(b.pr)-nnd(a.pr),
   pm2_asc:(a,b)=>nn(pm2(a))-nn(pm2(b)), area_desc:(a,b)=>nnd(b.a)-nnd(a.a),
   listed_desc:(a,b)=>String(b.li||"").localeCompare(String(a.li||"")),
   added_desc:(a,b)=>String(b.d||"").localeCompare(String(a.d||"")) }[sortBy];
 return rows.sort(f);
}

}

function topCmpRows(rows){

 const tie=(a,b)=>pos.get(a.id)-pos.get(b.id),nn=v=>v==null?Infinity:v,nnd=v=>v==null?-Infinity:v;

  score_desc:(a,b)=>nnd(topScoreStats(b).avg)-nnd(topScoreStats(a).avg)||tie(a,b),
  price_asc:(a,b)=>nn(a.pr)-nn(b.pr)||tie(a,b),
  pm2_asc:(a,b)=>nn(pm2(a))-nn(pm2(b))||tie(a,b),
  area_desc:(a,b)=>nnd(b.a)-nnd(a.a)||tie(a,b)

function topMoveColumn(id,delta){

// ================= MAPA (v8, 2026-08-06) =================================
// Filtry mapy są NIEZALEŻNE od filtrów listy (inny tryb pracy: lista = kolejka do
// przejrzenia, mapa = przegląd całego rynku), łączą się ze sobą (status ∩ kategoria)
// i są zapamiętywane w localStorage razem z pozycją mapy.
const HOME_LL = [51.8210, 19.4480];          // Radogoszcz
// KOLOR = region, KSZTAŁT = rodzaj. Para bezpieczna dla daltonizmu (walidator palet:
// ΔE 26,2 protanopia / 35,1 normalne widzenie) — patrz komentarz przy .pin w CSS.
const REG_COLOR = {m:"#1976d2", j:"#e8590c"};
const CAT_COLOR = {m_dz:REG_COLOR.m, m_dom:REG_COLOR.m, jez_dz:REG_COLOR.j, jez_dom:REG_COLOR.j};
const CAT_KSZT  = {m_dz:"k-dz", m_dom:"k-dom", jez_dz:"k-dz", jez_dom:"k-dom"};
const CAT_SHORT = {m_dz:"Mieszk. działki", m_dom:"Mieszk. domy", jez_dz:"Jeziora działki", jez_dom:"Jeziora domy"};
// Odległość od Radogoszcza pokazywana w popupie. Bezpośrednia odpowiedź na pytanie
// „czy ta pinezka jest tam, gdzie myślę" — liczba mówi to, czego oko na mapie nie oceni.
function kmOd(o){
  if(!hasGeo(o)) return null;
  const R=6371, d2r=Math.PI/180;
  const dla=(o.lat-HOME_LL[0])*d2r, dlo=(o.lon-HOME_LL[1])*d2r;
  const a2=Math.sin(dla/2)**2+Math.cos(HOME_LL[0]*d2r)*Math.cos(o.lat*d2r)*Math.sin(dlo/2)**2;
  return R*2*Math.asin(Math.min(1,Math.sqrt(a2)));
}
// Cena skrócona na etykietę pinezki: 449 000 → „449k", 1 250 000 → „1,25M".
const cenaKrotko = p => p==null ? "" :
  (p>=1e6 ? (p/1e6).toFixed(2).replace(/\.?0+$/,"").replace(".",",")+"M"
          : Math.round(p/1000)+"k");
let MAP=null, MCLUS=null, MRINGS=null, mapLoaded=false, mapDirty=true;
let mapSt = readLS("vMapSt", ["new","short","visited"]);
// MIGRACJA 2026-08-25. Filtr statusu na mapie siedzi w localStorage, więc telefon
// Mateusza ma tam zapisane ["new","short"] sprzed lejka — a to znaczy, że pierwsza
// oferta awansowana na 🔝 Top ZNIKNĘŁABY z mapy bez żadnego komunikatu i wyglądało
// by to jak zgubiony rekord. Dokładamy „visited" raz, pod własnym kluczem, żeby nie
// nadpisywać tego przy każdym wejściu (Mateusz ma prawo Top z mapy zdjąć).
if(!localStorage.vMapStTop){
  if(!mapSt.includes("visited")){ mapSt = mapSt.concat("visited"); writeLS("vMapSt", mapSt); }
  try{ localStorage.vMapStTop="1"; }catch(e){}
}
let mapCat = readLS("vMapCat", ["m_dz","m_dom","jez_dz","jez_dom"]);

function readLS(k, dflt){ try{ const v=JSON.parse(localStorage[k]); return Array.isArray(v)?v:dflt; }catch(e){ return dflt; } }
function writeLS(k, v){ try{ localStorage[k]=JSON.stringify(v); }catch(e){} }

// Leaflet + MarkerCluster ładowane LENIWIE — dopiero przy pierwszym wejściu na mapę.
// Lista ofert to główny ekran i nie ma powodu, żeby czekała na 200 kB bibliotek mapy.
function loadScript(src){ return new Promise((ok,no)=>{ const el=document.createElement("script"); el.src=src; el.onload=ok; el.onerror=()=>no(new Error(src)); document.head.appendChild(el); }); }
function loadCss(href){ return new Promise(ok=>{ const el=document.createElement("link"); el.rel="stylesheet"; el.href=href; el.onload=ok; el.onerror=ok; document.head.appendChild(el); }); }
async function ensureLeaflet(){
 if(window.L && window.L.markerClusterGroup) return true;
 try{
  await loadCss("https://unpkg.com/leaflet@1.9.4/dist/leaflet.css");
  await loadScript("https://unpkg.com/leaflet@1.9.4/dist/leaflet.js");
  await loadCss("https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css");
  await loadCss("https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css");
  await loadScript("https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js");
  if(!(window.L && window.L.markerClusterGroup)) return false;
  patchClusterHasLayer();
  return true;
 }catch(e){ return false; }
}
// SHIM dla niezgodności markercluster 1.5.3 ↔ Leaflet 1.9.4 (2026-08-06).
// Objaw: przy każdym zoomend/moveend na mapie leci „Uncaught TypeError: Cannot use 'in'
// operator to search for '_leaflet_id' in undefined". Źródło: markercluster wywołuje
// hasLayer() na obiekcie, którego `_layers` jeszcze (albo już) nie istnieje, a Leaflet
// 1.9 robi tam `stamp(layer) in this._layers` bez sprawdzenia.
// Dlaczego to naprawiamy, choć mapa „działa": nieprzechwycony wyjątek w handlerze
// zdarzenia PRZERYWA łańcuch pozostałych handlerów tego samego zdarzenia. Zapisywanie
// pozycji mapy (saveMapPos) też wisi na moveend — czyli błąd biblioteki mógł po cichu
// zjadać zapamiętywanie widoku, a to jeden z wymogów tej funkcji.
// Shim jest zawężony maksymalnie: gdy `_layers` istnieje, wołamy oryginał bez zmian.
let _clusterPatched=false;
function patchClusterHasLayer(){
 if(_clusterPatched) return; _clusterPatched=true;
 [L.Map, L.LayerGroup].forEach(K=>{
  if(!K||!K.prototype||!K.prototype.hasLayer) return;
  const orig=K.prototype.hasLayer;
  K.prototype.hasLayer=function(layer){
    if(!this._layers) return false;
    return orig.call(this,layer);
  };
 });
}

const hasGeo = o => o.lat!=null && o.lon!=null && !(Math.abs(o.lat)<0.01 && Math.abs(o.lon)<0.01);

function popupHtml(o){
 const oid=jsq(o.id);
 // onerror: CDN portali gubi zdjęcia (najczęściej OLX po zdjęciu oferty). Bez tego
 // w popupie zostawała szara ramka udająca, że zdjęcie się jeszcze wczytuje.
 const img = o.ph&&o.ph.length
   ? `<img loading="lazy" alt="" src="${esc(o.ph[0])}" onerror="this.remove()">` : "";
 const p2 = (o.pr&&o.a) ? " · "+fmt(Math.round(o.pr/o.a))+" zł/m²" : "";
 const s=decit(o);
 const d=kmOd(o);
 // Dystans od Radogoszcza: 15 km to granica geofence dla nieznanej miejscowości,
 // 8 km dla samego „Łódź". Liczba w popupie mówi od razu, czy oferta jest na skraju
 // kryteriów — i pozwala wychwycić pinezkę, która trafiła nie tam, gdzie powinna.
 // Przecinek dziesiętny, nie kropka — polska konwencja („1,6 km", nie „1.6 km").
 const dyst = d==null ? "" :
   ` · <b>${(d<10?d.toFixed(1).replace(".",","):String(Math.round(d)))} km</b> od Radogoszcza`;
 return `<div class="pp">${img}<b>${o.pr?fmt(o.pr)+" zł":"cena?"}</b> <span style="color:#666">${o.a?fmt(o.a)+" m²":""}${p2}</span>
  <span class="pl">${txt(cap(o.loc))} · ${esc(o.po||"")}${s?" · "+statusLabel(s):""}${dyst}</span>
  ${txt((o.t||"").slice(0,90))}
  <div class="pa"><button onclick="mapSet(${oid},'short')">⭐</button>${btnTop(o,`mapSet(${oid},'visited')`,"🔝")}<button onclick="mapSet(${oid},'rej')">✕</button>
   <button class="hid" onclick="mapSet(${oid},'hidden')" title="Ukryj — zniknie z mapy i list">🚫</button>
   <button onclick="mapOpen(${oid})">Szczegóły</button>
   ${linkOglosz(o.u,"Ogłoszenie")}</div></div>`;
}
// Ocena wprost z mapy — bez wychodzenia z niej. Po zmianie statusu odświeżamy pinezki,
// bo obwódka pinezki KODUJE status i musi się zmienić od razu.
function mapSet(id, st){ const o=oById(id); if(!o){ brakOferty(); return; }
 setSt(o, st).then(()=>{
  // Po ukryciu pinezka znika z mapy — popup zostałby wiszący w próżni nad pustym
  // miejscem, więc zamykamy go jawnie.
  if(MAP) MAP.closePopup();
  mapDirty=true; if(view==="map") drawMap(); }); }
function mapOpen(id){ if(MAP) MAP.closePopup(); openById(id); }

function saveMapPos(){ try{ if(!MAP) return; const c=MAP.getCenter(); localStorage.vMapPos=JSON.stringify([c.lat,c.lng,MAP.getZoom()]); }catch(e){} }

async function drawMap(){
 const wrap=document.getElementById("mapWrap");
 if(!mapLoaded){
  wrap.querySelector("#map").innerHTML='<div style="padding:26px;text-align:center;color:#777;font-size:13px">Wczytuję mapę…</div>';
  if(!await ensureLeaflet()){
   wrap.querySelector("#map").innerHTML='<div style="padding:26px;text-align:center;color:#c0392b;font-size:13px">Nie udało się wczytać mapy (brak sieci?).<br>Lista ofert działa normalnie.</div>';
   return;
  }
  wrap.querySelector("#map").innerHTML="";
  const pos=readLS("vMapPos", null);
  MAP=L.map("map",{zoomControl:true}).setView(pos?[pos[0],pos[1]]:HOME_LL, pos?pos[2]:10);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {maxZoom:19, attribution:"© OpenStreetMap"}).addTo(MAP);
  // disableClusteringAtZoom: od zoomu 16 pokazujemy POJEDYNCZE pinezki, nie bąbelki.
  // Dwa powody. (1) UX: przy zoomie ulicy chcemy widzieć, KTÓRA działka to która, a nie
  // „2". (2) Obejście błędu markercluster 1.5.3 + Leaflet 1.9: rozwijanie klastra
  // (spiderfy) wywala TypeError „Cannot use 'in' operator to search for '_leaflet_id'
  // in undefined" w jego własnym handlerze moveend, i wtedy popup się nie otwiera.
  // Bez klastrowania na dużym zoomie ta ścieżka w ogóle nie jest używana.
  MCLUS=L.markerClusterGroup({chunkedLoading:true, spiderfyOnMaxZoom:false,
    disableClusteringAtZoom:16, maxClusterRadius:52,
    // Własna ikona klastra: NEUTRALNA grafit i rozmiar rosnący z liczbą ofert.
    // Domyślne zielono-żółto-pomarańczowe bąbelki markerclustera czytały się jak
    // jeszcze jedna kategoria obok niebieskiego i pomarańczowego.
    iconCreateFunction: c => {
      const n=c.getChildCount();
      const sz = n<10?34 : n<50?42 : n<200?50 : 58;
      return L.divIcon({className:"", iconSize:[sz,sz], iconAnchor:[sz/2,sz/2],
        html:`<span class="mclus" style="width:${sz}px;height:${sz}px;`
            +`font-size:${n<100?13:12}px">${n}</span>`});
    }});
  MAP.addLayer(MCLUS);
  MAP.on("moveend zoomend", saveMapPos);
  // Etykiety cen pojawiają się od zoomu 15 — jedna klasa na kontenerze, bez
  // przebudowy 400 ikon (przebudowa przy każdym zoomie zamula telefon).
  const zoomKlasa=()=>document.getElementById("map")
    .classList.toggle("zoom-lg", MAP.getZoom()>=15);
  MAP.on("zoomend", zoomKlasa); zoomKlasa();
  dodajPrzyciskMnie();
  mapLoaded=true; mapDirty=true;
  document.getElementById("mapRings").checked = localStorage.vMapRings==="1";
 }
 // invalidateSize() PRZED przebudową warstw, nie po. Kontener dopiero co dostał
 // display:block, więc Leaflet zna jeszcze stary (zerowy) rozmiar. Gdy invalidateSize
 // leciało w setTimeout PO addLayers(), jego moveend trafiał w markercluster w trakcie
 // chunkedLoading i biblioteka rzucała „Cannot use 'in' operator … in undefined".
 if(MAP) MAP.invalidateSize();
 if(mapDirty){
  MCLUS.clearLayers();
  const rows=mapRows(), zGeo=rows.filter(hasGeo);
  const ms=zGeo.map(o=>L.marker([o.lat,o.lon],{icon:pinIcon(o)})
                        .bindPopup(()=>popupHtml(o),{maxWidth:250,minWidth:190}));
  MCLUS.addLayers(ms);
  drawRings();
  const brak=rows.length-zGeo.length;
  // Legenda pokazuje OBA kanały osobno (kolor = region, kształt = rodzaj), bo tak
  // je czyta oko — czterech wpisów „kolor+kształt razem" nikt nie zapamięta.
  const leg=`<span><i class="kdom" style="background:${REG_COLOR.m}"></i>Łódź i okolice</span>`
    +`<span><i class="kdom" style="background:${REG_COLOR.j}"></i>jeziora</span>`
    +`<span><i class="kdz" style="background:#7a7a7f"></i>działka</span>`
    +`<span><i class="kdom" style="background:#7a7a7f"></i>dom</span>`
    +`<span>⭐ złota obwódka = shortlist · 🔝 + czarny pierścień = Top · przygaszone = odrzucone</span>`;
  // Licznik „na mapie X z Y" jest OBOWIĄZKOWY, nie ozdobny: brak pinezki wygląda
  // dokładnie tak samo jak brak oferty, więc bez tej liczby mapa kłamie w milczeniu.
  document.getElementById("mapFoot").innerHTML =
    `Na mapie <b>${zGeo.length}</b> z <b>${rows.length}</b> ofert (wg filtrów mapy)`
    + (brak?` — <span class="lnk" onclick="toggleMissing()">${brak} bez współrzędnych ▾</span>`:"")
    + `<div class="leg">${leg}</div>`;
  renderMissing(rows.filter(o=>!hasGeo(o)));
  mapDirty=false;
 }
}
function drawRings(){
 if(!MAP) return;
 if(MRINGS){ MAP.removeLayer(MRINGS); MRINGS=null; }
 if(!document.getElementById("mapRings").checked) return;
 // 15 km = geofence dla nieznanej miejscowości, 8 km = geofence dla samego „Łódź"/„Zgierz".
 // Widok obu granic naraz pokazuje od razu, co jest na skraju kryteriów.
 MRINGS=L.layerGroup([
   L.circle(HOME_LL,{radius:15000,color:"#2b7bba",weight:1.4,fill:false,dashArray:"5,5"}),
   L.circle(HOME_LL,{radius:8000,color:"#c0392b",weight:1.4,fill:false,dashArray:"3,4"}),
   L.circleMarker(HOME_LL,{radius:4,color:"#c0392b",fillColor:"#c0392b",fillOpacity:1})
     .bindTooltip("Radogoszcz — punkt odniesienia")
 ]).addTo(MAP);
}
// ── MOJA LOKALIZACJA ────────────────────────────────────────────────────────
// Geolokalizacja wymaga HTTPS — GitHub Pages je daje, więc działa i w przeglądarce,
// i w aplikacji z ekranu głównego. Świadomie NIE pytamy o zgodę przy wejściu na mapę:
// przeglądarka pokazałaby monit systemowy bez kontekstu. Pytamy dopiero po kliknięciu
// przycisku ◎, czyli gdy Mateusz sam o to poprosił.
let ME=null, MEACC=null, meWatch=null;
function meIcon(){ return L.divIcon({className:"", iconSize:[16,16], iconAnchor:[8,8],
  html:'<span class="mepin"></span>'}); }
function pokazMnie(pos){
 const ll=[pos.coords.latitude, pos.coords.longitude], acc=pos.coords.accuracy||0;
 if(!MAP) return;
 if(!ME){ ME=L.marker(ll,{icon:meIcon(),zIndexOffset:1000,
            interactive:true}).addTo(MAP).bindPopup("Tu jesteś"); }
 else ME.setLatLng(ll);
 // Aureola dokładności: bez niej pojedynczy punkt sugeruje precyzję, której GPS
 // w telefonie nie ma (w budynku bywa 50–500 m).
 if(MEACC) MAP.removeLayer(MEACC);
 MEACC = acc>25 ? L.circle(ll,{radius:acc,color:"#1a73e8",weight:1,
           fillColor:"#1a73e8",fillOpacity:.08}).addTo(MAP) : null;
 const b=document.getElementById("meBtn"); if(b){ b.classList.add("on"); b.disabled=false; }
}
function bladLokalizacji(err){
 const b=document.getElementById("meBtn"); if(b){ b.classList.remove("on"); b.disabled=false; }
 toast(err && err.code===1 ? "Brak zgody na lokalizację (włącz w ustawieniach)"
       : "Nie udało się ustalić lokalizacji");
}
function mojaLokalizacja(){
 if(!navigator.geolocation){ toast("Ta przeglądarka nie umie geolokalizacji"); return; }
 const b=document.getElementById("meBtn");
 // Drugie kliknięcie = wyśrodkuj na mnie (a nie „włącz jeszcze raz").
 if(ME){ MAP.setView(ME.getLatLng(), Math.max(MAP.getZoom(),14)); return; }
 if(b) b.disabled=true;
 toast("Ustalam lokalizację…");
 navigator.geolocation.getCurrentPosition(p=>{
   pokazMnie(p);
   MAP.setView([p.coords.latitude,p.coords.longitude], Math.max(MAP.getZoom(),13));
   // watchPosition dopiero PO pierwszym trafieniu: w ruchu pinezka nadąża, a przy
   // nieudanej pierwszej próbie nie zostawiamy wiszącego nasłuchu na baterii.
   if(meWatch===null) meWatch=navigator.geolocation.watchPosition(
     pokazMnie, ()=>{}, {enableHighAccuracy:true, maximumAge:30000, timeout:20000});
 }, bladLokalizacji, {enableHighAccuracy:true, timeout:15000, maximumAge:60000});
}
function dodajPrzyciskMnie(){
 const C=L.Control.extend({options:{position:"bottomright"},
   onAdd(){ const b=L.DomUtil.create("button","mebtn");
     b.id="meBtn"; b.type="button"; b.textContent="◎";
     b.setAttribute("aria-label","Pokaż moją lokalizację");
     b.title="Moja lokalizacja";
     // stopPropagation: bez tego klik w przycisk przesuwa mapę pod spodem
     L.DomEvent.disableClickPropagation(b);
     L.DomEvent.on(b,"click",e=>{ L.DomEvent.stop(e); mojaLokalizacja(); });
     return b; }});
 new C().addTo(MAP);
}

// ── PEŁNY EKRAN MAPY ────────────────────────────────────────────────────────
let mapFsOn=false;
function setMapFs(on){
 mapFsOn=!!on;
 const w=document.getElementById("mapWrap");
 w.classList.toggle("fs", mapFsOn);
 document.body.classList.toggle("fs-lock", mapFsOn||topFocus);
 const b=document.getElementById("mapFs");
 b.textContent = mapFsOn ? "⤢ Zwykły widok" : "⛶ Pełny ekran";
 b.setAttribute("aria-label", mapFsOn ? "Wyjdź z pełnego ekranu" : "Pełny ekran mapy");
 // Leaflet trzyma rozmiar kontenera w pamięci — bez invalidateSize() po zmianie
 // wysokości kafelki zostają narysowane na starym obszarze i pół mapy jest szare.
 // Dwa wywołania: od razu (żeby nie było mrugnięcia) i po klatce (gdy layout flexa
 // jest już policzony).
 if(MAP){ MAP.invalidateSize(); requestAnimationFrame(()=>MAP.invalidateSize()); }
 try{ localStorage.vMapFs = mapFsOn ? "1" : "0"; }catch(e){}
}
document.getElementById("mapFs").onclick=()=>setMapFs(!mapFsOn);
document.getElementById("mapClose").onclick=()=>setMapFs(false);
// Esc zamyka pełny ekran. Sprawdzamy PRZED obsługą modala oferty (ten sam klawisz),
// bo gdy mapa jest na pełnym ekranie, to ona jest wierzchnią warstwą.
document.addEventListener("keydown", e=>{
 if(e.key==="Escape" && topFocus && !cur){ setTopFocus(false); e.preventDefault(); e.stopImmediatePropagation(); return; }
 if(e.key==="Escape" && mapFsOn && !cur){ setMapFs(false); e.stopPropagation(); }
}, true);

let missingOpen=false;
function toggleMissing(){ missingOpen=!missingOpen; renderMissing(mapRows().filter(o=>!hasGeo(o))); }
function renderMissing(rows){
 const el=document.getElementById("mapMissing");
 if(!missingOpen||!rows.length){ el.innerHTML=""; return; }
 const r=rows.slice(0,300).map(o=>{
   return `<tr><td>${esc(CAT_SHORT[o.c]||o.c)}</td><td><span class="mm-open" onclick="mapOpen(${jsq(o.id)})">${txt((o.t||"bez tytułu").slice(0,72))}</span><br><span style="color:#888">${o.pr?fmt(o.pr)+" zł":"cena?"} · ${txt(cap(o.loc))} · ${esc(o.po||"")}</span></td></tr>`; }).join("");
 el.innerHTML=`<table><tbody>${r}</tbody></table>`
   + (rows.length>300?`<div style="font-size:12px;color:#888;padding:6px 0">…i ${rows.length-300} więcej</div>`:"");
}
document.getElementById("mapStatus").addEventListener("click",e=>{
 const c=e.target.closest(".mchip"); if(!c) return;
 const v=c.dataset.s; mapSt = mapSt.includes(v) ? mapSt.filter(x=>x!==v) : mapSt.concat(v);
 c.classList.toggle("on", mapSt.includes(v)); writeLS("vMapSt", mapSt); mapDirty=true; drawMap();
});
document.getElementById("mapCats").addEventListener("click",e=>{
 const c=e.target.closest(".mchip"); if(!c) return;
 const v=c.dataset.c; mapCat = mapCat.includes(v) ? mapCat.filter(x=>x!==v) : mapCat.concat(v);
 c.classList.toggle("on", mapCat.includes(v)); writeLS("vMapCat", mapCat); mapDirty=true; drawMap();
});
document.getElementById("mapRings").addEventListener("change",e=>{
 try{ localStorage.vMapRings = e.target.checked?"1":"0"; }catch(err){}
 drawRings();
});
function restoreMapChips(){
 document.querySelectorAll("#mapStatus .mchip").forEach(c=>c.classList.toggle("on", mapSt.includes(c.dataset.s)));
 document.querySelectorAll("#mapCats .mchip").forEach(c=>c.classList.toggle("on", mapCat.includes(c.dataset.c)));
}
restoreMapChips();

// ---------- STATYSTYKI (uproszczone, mobile-first: tylko panele wpływające na decyzję) ----------
function setView(v){ view=v;
 document.getElementById("grid").style.display=v==="list"?"":"none";
 document.querySelector(".bar2").style.display=v==="list"?"":"none";
 document.getElementById("counter").style.display=v==="list"?"":"none";
 document.getElementById("stats").style.display=v==="stats"?"block":"none";
 document.getElementById("mapWrap").classList.toggle("on", v==="map");
 // Wyjście z widoku mapy MUSI zdjąć pełny ekran: klasa .fs to position:fixed, więc
 // gdyby została, przykryłaby listę ofert niewidzialnym kontenerem (display:none
 // zdejmuje ją z widoku, ale blokada przewijania body zostałaby na zawsze).
 if(v!=="map" && mapFsOn) setMapFs(false);
 // W widoku mapy chowamy filtry LISTY (Do przejrzenia / Shortlist / Odrzucone /
 // Wszystkie): mapa ma własny, wielokrotnego wyboru filtr statusu, a dwa różne
 // filtry statusu na jednym ekranie to pewne nieporozumienie („dlaczego shortlist
 // nie znika?"). Przy okazji odzyskujemy cały wiersz wysokości — na telefonie 375 px
 // pasek nagłówka zajmował ~590 px, czyli mapa startowała pod krawędzią ekranu.
 document.querySelectorAll(".bar .chip[data-f]").forEach(c=>{ c.style.display = v==="map"?"none":""; });
 const b=document.getElementById("statsToggle"); b.classList.toggle("on",v==="stats"); b.textContent=v==="stats"?"← Oferty":"📊 Statystyki";
 const m=document.getElementById("mapToggle"); m.classList.toggle("on",v==="map"); m.textContent=v==="map"?"← Oferty":"🗺 Mapa";
 if(v==="stats") renderStats();
 if(v==="map"){ drawMap();
   // Pełny ekran jest zapamiętywany: jeśli Mateusz ostatnio oglądał mapę na pełnym
   // ekranie, to znaczy, że tak jej używa — niech nie klika drugi raz przy każdym wejściu.
   if(localStorage.vMapFs==="1") setTimeout(()=>setMapFs(true), 80);
   // Przewiń mapę na ekran — inaczej na telefonie po kliknięciu „🗺 Mapa" widać
   // dalej sam pasek nagłówka i wygląda to, jakby nic się nie stało.
   setTimeout(()=>{ const el=document.getElementById("mapWrap");
     if(el&&el.scrollIntoView) el.scrollIntoView({block:"start",behavior:"smooth"}); }, 60);
 }
 try{ localStorage.vView = v; }catch(e){}
}
const daysBetween = (a,b)=> Math.round((b-a)/864e5);
const statSet = () => statCat==="all"?O:O.filter(o=>o.c===statCat);
const panel = (title,sub,html)=>`<div class="panel"><h3>${title}</h3>${sub?`<div class="sub">${sub}</div>`:""}${html}</div>`;
const bar = (label,val,max,valTxt)=>{ const w=max?Math.round(val/max*100):0; return `<div class="bar-row"><span class="lbl">${esc(label)}</span><span class="bar-track"><span class="bar-fill" style="width:${w}%"></span></span><span class="val">${valTxt??val}</span></div>`; };

function panelLejek(rows){
 const c={new:0,short:0,visited:0,rej:0}; rows.forEach(o=>{ const k=norm(o.st); c[k]=(c[k]||0)+1; });
 // Top liczy się do „ocenionych" tak samo jak shortlist — to decyzja na TAK, tylko
 // mocniejsza. Gdyby wypadał z mianownika, procent odrzuceń rósłby przy każdym awansie.
 const decided=c.short+c.visited+c.rej, rejPct=decided?Math.round(c.rej/decided*100):0;
 return panel("Przegląd","Lejek: do przejrzenia → ⭐ shortlist → 🔝 Top.",
  `<div class="kpi"><div class="box"><b>${c.new}</b><span>do przejrzenia</span></div><div class="box"><b class="grow">${c.short}</b><span>⭐ shortlist</span></div><div class="box"><b class="grow">${c.visited}</b><span>🔝 Top</span></div><div class="box"><b class="gred">${c.rej}</b><span>✕ odrzucone</span></div><div class="box"><b>${rejPct}%</b><span>odrzuceń z ocenionych</span></div></div>`);
}
function panelBenchmark(rows){
 const g={}; rows.forEach(o=>{ const p=pm2(o); if(p==null||!o.loc)return; (g[o.loc]=g[o.loc]||[]).push(o); });
 const arr=Object.entries(g).map(([loc,os])=>{ const ps=os.map(pm2).filter(x=>x!=null);
   return {loc,n:os.length,mp:median(ps),mn:Math.min(...ps),mx:Math.max(...ps)}; }).filter(x=>x.mp!=null).sort((a,b)=>b.n-a.n);
 if(!arr.length) return panel("Tanio czy drogo? (zł/m² wg strefy)","Brak ofert z ceną i metrażem w tej kategorii.","");
 const body=arr.map(r=>`<tr><td>${txt(cap(r.loc))}</td><td class="num">${r.n}</td><td class="num"><b>${fmt(Math.round(r.mp))}</b></td><td class="num">${fmt(Math.round(r.mn))}–${fmt(Math.round(r.mx))}</td></tr>`).join("");
 return panel("Tanio czy drogo? (zł/m² wg strefy)","Mediana zł/m² i widełki w każdej strefie — szybka ocena, czy oferta jest poniżej/powyżej rynku.",
  `<div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Strefa</th><th class="num">Ofert</th><th class="num">Med. zł/m²</th><th class="num">Widełki</th></tr></thead><tbody>${body}</tbody></table></div>`);
}
function panelOkazje(rows){
 const drops=rows.map(o=>({o,d:priceDelta(o)})).filter(x=>x.d&&!x.d.up).sort((a,b)=>a.d.pct-b.d.pct).slice(0,6);
 const today=new Date();
 const hang=rows.filter(o=>norm(o.st)==="new"&&o.li&&/^\d{4}-\d{2}-\d{2}/.test(o.li)).map(o=>({o,days:daysBetween(new Date(o.li),today)})).filter(x=>x.days>=0).sort((a,b)=>b.days-a.days).slice(0,6);
 const dHtml=drops.length?`<table class="tbl"><thead><tr><th>Oferta</th><th class="num">Teraz</th><th class="num">Spadek</th></tr></thead><tbody>`+drops.map(x=>`<tr><td>${txt((x.o.t||"").slice(0,34))}</td><td class="num">${fmt(x.o.pr)} zł</td><td class="num gred">${x.d.pct}%</td></tr>`).join("")+`</tbody></table>`:`<div class="sub">Brak spadków (pojawią się, gdy ceny ofert spadną).</div>`;
 const hHtml=hang.length?`<table class="tbl"><thead><tr><th>Oferta</th><th class="num">Cena</th><th class="num">Wisi</th></tr></thead><tbody>`+hang.map(x=>`<tr><td>${txt((x.o.t||"").slice(0,34))}</td><td class="num">${x.o.pr?fmt(x.o.pr)+" zł":"—"}</td><td class="num">${x.days} dni</td></tr>`).join("")+`</tbody></table>`:`<div class="sub">Brak dat ogłoszeń.</div>`;
 return panel("Okazje negocjacyjne","Największe spadki cen i oferty wiszące najdłużej (potencjał negocjacji).",
  `<b style="font-size:13px">🔻 Największe spadki</b>${dHtml}<div style="height:12px"></div><b style="font-size:13px">⏳ Najdłużej wiszące</b>${hHtml}`);
}
function panelPodaz(rows){
 const bz={},bp={}; rows.forEach(o=>{ if(o.loc)bz[o.loc]=(bz[o.loc]||0)+1; if(o.po)bp[o.po]=(bp[o.po]||0)+1; });
 const za=Object.entries(bz).sort((a,b)=>b[1]-a[1]).slice(0,8), zmax=Math.max(1,...za.map(x=>x[1]));
 const pa=Object.entries(bp).sort((a,b)=>b[1]-a[1]), pmax=Math.max(1,...pa.map(x=>x[1]));
 const priced=rows.map(o=>o.pr).filter(x=>x);
 const bk=[[0,250000,"<250k"],[250000,500000,"250–500k"],[500000,750000,"500–750k"],[750000,1000000,"750k–1M"],[1000000,1e12,">1M"]];
 const hp=bk.map(([a,b,l])=>[l,priced.filter(p=>p>=a&&p<b).length]), hpmax=Math.max(1,...hp.map(x=>x[1]));
 return panel("Gdzie jest podaż","Ile ofert w strefie, na portalu i w przedziale ceny.",
  `<b style="font-size:13px">Wg strefy (top 8)</b>${za.map(([l,n])=>bar(cap(l),n,zmax,n)).join("")}<div style="height:10px"></div><b style="font-size:13px">Wg portalu</b>${pa.map(([l,n])=>bar(l,n,pmax,n)).join("")}<div style="height:10px"></div><b style="font-size:13px">Przedział ceny</b>${hp.map(([l,n])=>bar(l,n,hpmax,n)).join("")}`);
}
function panelShortlist(st, tytul, pusty, opis){
 const sl=O.filter(o=>norm(o.st)===st);
 if(!sl.length) return panel(tytul, pusty, "");
 const body=sl.map(o=>{ const links=[]; if(o.tel)links.push(`<a href="tel:${esc(o.tel)}">📞 ${esc(o.tel)}</a>`); if(o.lat!=null&&o.lon!=null)links.push(`<a href="${esc(mapsUrl(o.lat+','+o.lon))}" target="_blank" rel="noopener">📍 Mapa</a>`);
   return `<div class="slcard"><div class="t">${txt(o.t)}</div><div class="m">${o.pr?fmt(o.pr)+" zł":"—"}${o.a?" · "+fmt(o.a)+" m²":""}${o.pr&&o.a?" · "+fmt(Math.round(o.pr/o.a))+" zł/m²":""} · ${txt(cap(o.loc))} · ${esc(CATPL[o.c]||"")}</div>${links.length?`<div class="lnk">${links.join("")}</div>`:""}</div>`; }).join("");
 return panel(tytul+" ("+sl.length+")", opis, body);
}
function renderStats(){
 const rows=statSet();
 const tabs=`<div class="stat-tabs">`+[["all","Wszystkie"],["m_dz","🏠 Działki"],["m_dom","🏠 Domy"],["jez_dz","🌊 Jez. działki"],["jez_dom","🌊 Jez. domy"]].map(([v,l])=>`<button class="${statCat===v?"on":""}" onclick="statCat='${v}';renderStats()">${l}</button>`).join("")+`</div>`;
 document.getElementById("stats").innerHTML = tabs + panelLejek(rows) + panelBenchmark(rows) + panelOkazje(rows)
   + panelShortlist("visited","🔝 Top","Tu trafią oferty awansowane z shortlisty.","Ścisła czołówka — to, po co ten system istnieje.")
   + panelShortlist("short","⭐ Shortlist","Tu pojawią się oferty oznaczone ⭐ — zestawione do finalnej decyzji.","Faworyci czekający na awans do 🔝 Top.")

}

// przerysować pinezki — inaczej po nocnym publishu mapa pokazywałaby wczorajszy stan.

const mapRow = r => ({id:r.id,c:r.cat,t:r.title,u:r.url,pr:r.price,a:r.area,ph:r.photos||[],n:r.notes||"",loc:r.loc||"",d:r.added,po:r.portal,st:r.status||"new",li:(r.listed||""),adr:r.address||"",lat:r.lat,lon:r.lon,tel:r.phone||"",op:r.orig_price});

// FIX 2026-08-06: PostgREST ma serwerowy limit db-max-rows=1000. Dotad load() robil
// goly .select() bez .range(), wiec przy 2059 wierszach aplikacja pokazywala 1000 —
// 1059 ofert (w tym 143 nieocenione) bylo NIEWIDOCZNYCH. Brak .order() dodatkowo
// znaczyl, ze te 1000 przychodzilo w kolejnosci fizycznej tabeli, czyli zestaw
// ukrytych zmienial sie po kazdym DELETE/VACUUM. Teraz stronicujemy po 1000.
// Tie-break .order("id") jest KONIECZNY: bez niego wiersze o identycznym "added"
// moga sie powtarzac albo gubic miedzy kolejnymi .range().
const PAGE_SIZE = 1000;
// sortKey = kolumna glowna (malejaco), tieKey = tie-break (rosnaco). Tie-break jest
// KONIECZNY: bez niego wiersze o identycznej wartosci sortKey moga sie powtarzac albo
// gubic miedzy kolejnymi .range() — PostgreSQL nie gwarantuje stabilnej kolejnosci.
async function fetchAllRows(table, cols, sortKey, tieKey){
 let from = 0, out = [];
 for(;;){
   let q = sb.from(table).select(cols).order(sortKey, { ascending: false });
   if(tieKey) q = q.order(tieKey, { ascending: true });
   const { data, error } = await q.range(from, from + PAGE_SIZE - 1);
   if(error) return { data: null, error };
   out = out.concat(data);
   if(data.length < PAGE_SIZE) break;
   from += PAGE_SIZE;
   if(from > 100000) break;   // bezpiecznik
 }
 return { data: out, error: null };
}
const fetchAllOffers = () => fetchAllRows("offers", LIST_COLS, "added", "id");

async function load(){
 const { data, error } = await fetchAllOffers();
 if(error){ if(!O.length) document.getElementById("grid").innerHTML='<div class="none">Błąd wczytywania bazy: '+esc(error.message)+'</div>'; setDot("off"); setDot._s="off"; return; }
 const byId={}; O.forEach(o=>byId[o.id]=o);
 O = data.map(r=>{ const m=mapRow(r); const old=byId[r.id]; if(old){ m.de=old.de; m.prm=old.prm; if(old.n)m.n=old.n; if(old.adr)m.adr=old.adr; } return m; });
 computeZoneMedians();
 if(cur){ const c=O.find(x=>x.id===cur.id); if(c){ cur=c; drawD(); } }   // re-link otwartej oferty po przeładowaniu
 // ten sam limit 1000 dotyczy decisions (613 wierszy na 06.08, rosnie z kazda decyzja
 // ⭐/✕ — po przekroczeniu 1000 licznik dziennego przegladu zaczalby zanizac po cichu)
 const dr = await fetchAllRows("decisions", "id,offer_id,status,decided_at", "decided_at", "offer_id");
 DECS = dr.data||[];
 loadTopReviewsFromDecisions();
 await loadNotesIndex();
 lastLoad=Date.now();
 document.title="Oferty ("+O.length+")"; render(); if(view==="stats") renderStats();
 mapDirty=true; if(view==="map") drawMap();
}
function subscribe(){
 sb.channel("offers-rt").on("postgres_changes",{event:"*",schema:"public",table:"offers"}, payload=>{
   const r=payload.new||payload.old; if(!r) return;
   if(payload.eventType==="DELETE"){ O=O.filter(o=>o.id!==r.id); }
   else { const o=O.find(x=>x.id===r.id); const m=mapRow(payload.new); if(o){ Object.assign(o,m); } else { O.push(m); } }
   render(); mapDirty=true; if(view==="map") drawMap();
   if(cur){ const c=O.find(x=>x.id===cur.id); if(c){ const de=cur.de,prm=cur.prm,ns=cur.notesList; cur=c; cur.de=de; cur.prm=prm; cur.notesList=ns; drawD(); } }
 }).subscribe(s=>{ setDot._s=(s==="SUBSCRIBED"?"live":"off"); setDot(setDot._s); render(); });
}
// odśwież po powrocie do karty, ale nie częściej niż co 60 s (realtime i tak trzyma dane świeże)
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible" && Date.now()-lastLoad>60000) load(); });
load().then(subscribe);
// Widoku „map" NIE przywracamy na starcie celowo: pierwszy ekran ma być listą ofert,
// a mapa dociąga 200 kB bibliotek. Zapamiętany jest natomiast stan filtrów i pozycja.
